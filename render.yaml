services:
  - type: web
    name: tradepilot-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TRADEPILOT_BACKEND_URL
        value: https://tradepilot-live-backend.onrender.com
      - key: AUTO_POLL_SECONDS
        value: "15"
