services:
  - type: web
    name: tradepilot-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: PORT
        value: 10000
